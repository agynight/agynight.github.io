  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    /* Center everything vertically + horizontally */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 32px;
    }

    /* Buttons */
    a {
      display: block;
      width: fit-content;          /* auto-fit to content */
      margin: 12px auto;
      padding: 12px 24px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      font-size: 22px;
      border-radius: 8px;
      white-space: nowrap;         /* keep text on one line */
      transition: 0.2s;
    }

    a:hover {
      background-color: #004c99;
    }

    /* 📱 Mobile adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      a {
        font-size: 26px;
        padding: 14px 26px;
      }
    }
  </style>
</head>
